<style>
:root{
  --bg:#F2F3F1; --surface:#FFFFFF;
  --ink:#191C1A; --muted:#656B67; --faint:#9A9F9B; --line:#D9DCD8;
  --accent:#2E6A4E; --accent-soft:#DDEBE3; --accent-ink:#FFFFFF;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111413; --surface:#191D1B;
    --ink:#E7EAE8; --muted:#9DA4A0; --faint:#6E7571; --line:#2D3330;
    --accent:#72C39A; --accent-soft:#1F3329; --accent-ink:#0E1A14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111413; --surface:#191D1B;
  --ink:#E7EAE8; --muted:#9DA4A0; --faint:#6E7571; --line:#2D3330;
  --accent:#72C39A; --accent-soft:#1F3329; --accent-ink:#0E1A14;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:32px 48px}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:clamp(17px,4.9vw,20px);font-weight:700;letter-spacing:-.02em;margin:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:7px;row-gap:3px;min-width:0}
h1 [data-i="h1"]{white-space:nowrap}
.wrap>*{min-width:0}
header{min-width:0}
.ver{font:600 12px var(--mono);letter-spacing:0;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.lang button{font:600 12px var(--sans);letter-spacing:.04em;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
section{display:grid;gap:10px}

.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys button{font:600 16px var(--sans);height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
.keys button:hover{border-color:var(--faint)}
.keys button sup{font-size:.6em;font-weight:500;margin-left:1px;opacity:.75}
.keys button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.field .in.auto{background:transparent;border-style:dashed}
.field .in.auto output{font:500 16px var(--mono);color:var(--muted);padding:10px;flex:1}
.field{display:grid;gap:4px;grid-template-rows:1fr auto}
.field label{align-self:end}
.field label{font-size:12.5px;color:var(--muted);line-height:1.25}
.field .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding-right:9px}
.field .in:focus-within{border-color:var(--accent)}
.field input{font:500 16px var(--mono);background:transparent;border:0;color:var(--ink);width:100%;min-width:0;padding:10px;outline:none}
.field .u{color:var(--faint);font-size:12px}

.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;background:var(--accent-soft)}
.row .k{color:var(--muted)}
.row:first-child .k{color:var(--ink);font-weight:600}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;white-space:nowrap}
.row:first-child .v{font-size:34px}
.row .v small{font-size:13px;color:var(--muted);margin-left:4px}
.howto{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.howto h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.howto ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px;line-height:1.45}
.howto b{font-weight:700}
.fb{font-size:13.5px;color:var(--muted);margin:0;padding:0 4px;line-height:1.5}
.fb a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.fb a:hover{text-decoration:underline}
.chev{font:500 20px var(--mono);color:var(--muted);width:24px;text-align:center}
.tuner{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid}
.tn-toggle{all:unset;box-sizing:border-box;width:100%;height:64px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-radius:14px}
.tn-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tn-tt{display:grid;gap:2px;min-width:0}
.tn-tt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn-body{display:grid;gap:14px;padding:2px 12px 16px}
.tn-body[hidden]{display:none}
.tn-head{display:flex;align-items:center;gap:10px}
.tn-btn{flex:none;font:600 13.5px var(--sans);border:0;border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.tn-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tn-level{flex:1;height:6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tn-level i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
.tn-main{display:grid;gap:8px;padding:4px 0}
.tn-main.stale{opacity:.45}
.tn-read{display:flex;align-items:baseline;justify-content:center;gap:12px}
.tn-note{font:500 34px var(--mono);line-height:1}
.tn-note sup{font-size:.5em}
.tn-cents{font:500 14px var(--mono);color:var(--muted)}
.tn-meter{position:relative;height:22px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tn-zone{position:absolute;top:0;bottom:0;left:45%;width:10%;background:var(--accent-soft)}
.tn-mid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--faint)}
.tn-needle{position:absolute;top:2px;bottom:2px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);left:50%;transition:left .25s ease-out}
.tn-needle.ok{background:var(--accent)}
.tn-tip{font-size:12.5px;color:var(--muted);text-align:center;margin:0;min-height:0}
.tn-tip:empty{display:none}
.tn-targets{display:grid;grid-template-columns:10px repeat(4,1fr);gap:7px;align-items:center;max-width:420px;width:100%;justify-self:center}
.tn-reg{font:600 11px var(--mono);color:var(--faint);align-self:center;text-align:center}
.tn-t{position:relative;font:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:0;aspect-ratio:1/1;width:100%;display:block;background:var(--bg);transition:background .15s,border-color .15s}
.tn-t b{position:absolute;left:calc(50% - 5px);top:50%;transform:translateY(-50%);font-size:16px;font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tn-t b sup{font-size:.62em;font-weight:500}
.tn-t .fd{position:absolute;left:calc(50% - 22px);top:50%;transform:translateY(-50%);display:grid;gap:4px}
.tn-t .fd i{display:block;width:8px;height:8px;border-radius:50%;border:1.4px solid var(--ink);box-sizing:border-box}
.tn-t .fd i.cl{background:var(--ink)}
.tn-t .pl{position:absolute;bottom:5px;right:6px;font-size:8px;color:var(--accent);line-height:1}
.tn-t .c{display:none}
.tn-t.on{border-color:var(--accent);background:var(--accent-soft)}
.tn-t.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tn-t.ok .fd i{border-color:var(--accent-ink)} .tn-t.ok .fd i.cl{background:var(--accent-ink)} .tn-t.ok .pl{color:var(--accent-ink)}
.tn-t[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.tn-tap{font-size:12.5px;color:var(--muted);margin:-2px 0 0;text-align:center}
.tn-hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5;text-align:center}
.kd-reset{flex:none;font:600 13px var(--sans);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--surface);color:var(--ink)}
.kd-time{margin-left:auto;font:500 13px var(--mono);color:var(--muted)}
.kd-now{display:flex;justify-content:center;align-items:baseline;gap:10px;font:500 26px var(--mono);min-height:32px}
.kd-now sup{font-size:.5em}
.kd-now small{font:500 12px var(--mono);color:var(--muted)}
.kd-hist{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:92px}
.kd-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.kd-bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--accent-soft);min-height:3px;transition:height .3s ease-out}
.kd-bar.in i{background:var(--accent)}
.kd-bar span{font:600 10.5px var(--mono);color:var(--muted)}
.kd-res{display:grid;gap:8px}
.kd-r{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.kd-r.best{border-color:var(--accent);background:var(--accent-soft)}
.kd-r b{font-size:17px}
.kd-r b sup{font-size:.6em;font-weight:500}
.kd-r .kd-m{font-size:12.5px;color:var(--muted);line-height:1.35}
.kd-l{display:grid;gap:3px}
.kd-r .kd-p{font-size:12px;font-weight:600;color:var(--accent)}
.kd-msg{font-size:13.5px;color:var(--muted);text-align:center;margin:0}
.drawing{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 12px 12px;display:grid;gap:6px}
.drawing .label{padding-left:6px}
.drawing svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.tube{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.2}
.hole{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.dim{stroke:var(--muted);stroke-width:1;fill:none}
.ext{stroke:var(--faint);stroke-width:.8;stroke-dasharray:3 3;fill:none}
.tick{stroke:var(--ink);stroke-width:1.4}
.dtxt{fill:var(--ink);font:500 13px var(--mono)}
.dtxt.total{fill:var(--accent);font-weight:600}
.num{fill:var(--ink);font:700 13px var(--sans)}
.cap{fill:var(--muted);font:500 12px var(--sans)}
</style>
</head>
<body>

  <header>

    <div class="tn-main" id="tnMain">

  <section class="tuner" id="kd">

    <div class="kd-hist" id="kdHist" aria-hidden="true"></div>
    <div class="kd-res" id="kdRes"></div>
    <p class="tn-hint" data-i="kdHint"></p>
    </div>
  </section>

  <section>

      <div class="field"><label for="hole" data-i="hole">Диаметр отверстий</label><div class="in"><input id="hole" type="text" inputmode="decimal"><span class="u" data-i="mm">мм</span></div></div>
    </div>
  </section>

  <div class="result" id="result" aria-live="polite"></div>

  <div class="drawing" id="drawingBox">
    <span class="label" data-i="draw">Чертёж</span>
    <div id="drawing"></div>
  </div>

  <div class="howto" id="howto"></div>


  <p class="fb" id="fb"></p>
</div>

        kdHint:"Works best with a single voice: singing, whistling, a kamyl or another solo instrument. Music with accompaniment can confuse it. Tap a suggestion to select that key in the calculator.",

  const DEF={lang:"ru",key:5,bore:14,outer:16,hole:8,tuner:false};
  let S=Object.assign({},DEF);

  if(!(S.outer>0)) S.outer=S.bore+2*(S.wall>0?S.wall:1);
  delete S.wall;
  if(location.hash==="#en")S.lang="en";else if(location.hash==="#ru")S.lang="ru";
  const $=id=>document.getElementById(id);
  const t=()=>TXT[S.lang]||TXT.ru;

  const wallOf=()=>(S.outer-S.bore)/2;
  function calc(tonic){
    const c=331.3+0.606*TEMP;
    const Leff=m=>c*1000/(2*A4*Math.pow(2,(m-69)/12));
    const L=Leff(tonic)-BLOW-0.6133*S.bore/2;
    const te=wallOf()+0.75*S.hole, R=Math.pow(S.bore/S.hole,2);
    let prev=L, ok=L>0&&S.bore>0&&S.hole>0&&wallOf()>0; const holes=[], centers=[];
    for(const st of STEPS){
      const target=Leff(tonic+st)-BLOW; let lo=0,hi=prev;
      for(let i=0;i<70;i++){const x=(lo+hi)/2,g=Math.max(prev-x,1e-6);const z=g/2*(Math.sqrt(1+4*te/g*R)-1);if(x+z>target)hi=x;else lo=x;}
      const x=(lo+hi)/2; if(x<=S.hole)ok=false;
      holes.push(x-S.hole/2); centers.push(x); prev=x;
    }
    return {L,holes,centers,ok};
  }

  const keysEl=$("keys");
  KEYS.forEach(([n,m],i)=>{const b=document.createElement("button");b.type="button";b.innerHTML=n+"<sup>"+(Math.floor(m/12)-1)+"</sup>";b.addEventListener("click",()=>{S.key=i;render();});keysEl.appendChild(b);});
  ["bore","outer","hole"].forEach(k=>{const el=$(k);el.value=S[k];el.addEventListener("input",()=>{const v=parseFloat(el.value.replace(",","."));if(isFinite(v)&&v>0){S[k]=v;render();}});});

  // Вертикальный чертёж: вдув сверху, размеры цепочкой от вдува
  function drawing(r,T){
    const H=480, top=34, sc=H/r.L, W=300;
    const tx=58, tw=18;                       // трубка (ширина не в масштабе)
    const Y=v=>top+v*sc;
    const dimX=[tx+tw+44,tx+tw+84,tx+tw+124,tx+tw+172]; // отв.3, отв.2, отв.1, длина
    let o=`<svg viewBox="0 0 ${W} ${top+H+34}" role="img" aria-label="${T.draw}">`;
    // extension line at the blowing end
    o+=`<line class="ext" x1="${tx+tw}" y1="${top}" x2="${dimX[3]+8}" y2="${top}"/>`;
    // tube
    o+=`<rect class="tube" x="${tx}" y="${top}" width="${tw}" height="${r.L*sc}" rx="2"/>`;
    o+=`<text class="cap" x="${tx+tw/2}" y="${top-12}" text-anchor="middle">${T.top}</text>`;
    // holes
    const hr=Math.max(S.hole*sc/2,4.5);
    r.centers.forEach((c,i)=>{
      o+=`<circle class="hole" cx="${tx+tw/2}" cy="${Y(c)}" r="${hr}"/>`;
      o+=`<text class="num" x="${tx-10}" y="${Y(c)+4.5}" text-anchor="end">${i+1}</text>`;
    });
    // dimension helper
    const dim=(x,y2,label,cls)=>{
      let d=`<line class="ext" x1="${tx+tw}" y1="${y2}" x2="${x+8}" y2="${y2}"/>`;
      d+=`<line class="dim" x1="${x}" y1="${top}" x2="${x}" y2="${y2}"/>`;
      d+=`<line class="tick" x1="${x-4}" y1="${top+4}" x2="${x+4}" y2="${top-4}"/>`;
      d+=`<line class="tick" x1="${x-4}" y1="${y2+4}" x2="${x+4}" y2="${y2-4}"/>`;
      const my=(top+y2)/2;
      d+=`<text class="dtxt ${cls||""}" x="${x-6}" y="${my}" text-anchor="middle" transform="rotate(-90 ${x-6} ${my})">${label}</text>`;
      return d;
    };
    // holes 3,2,1 from the tube outward, then total length
    [2,1,0].forEach((i,k)=>{o+=dim(dimX[k],Y(r.holes[i]),Math.round(r.holes[i]));});
    o+=dim(dimX[3],Y(r.L),Math.round(r.L),"total");
    o+=`<text class="cap" x="${tx+tw/2}" y="${Y(r.L)+22}" text-anchor="middle">${T.bottom}</text>`;
    o+=`<text class="cap" x="${W-4}" y="${Y(r.L)+22}" text-anchor="end">${T.scaleNote}</text>`;
    return o+"</svg>";
  }


  // ---------- tuner
  const TN={on:false,ctx:null,stream:null,an:null,buf:null,hist:[],last:0,raf:0,match:null,sm:null};
  const NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const noteHtml=m=>NN[((m%12)+12)%12]+"<sup>"+(Math.floor(m/12)-1)+"</sup>";
  const fOf=m=>A4*Math.pow(2,(m-69)/12);
  const noteTxtA=m=>NN[((m%12)+12)%12]+(Math.floor(m/12)-1);
  // all notes of the kamyl, as in the fingering chart: 4 registers x 4 fingerings + 2 top notes
  const REGS=[0,12,19,24];
  const allNotes=()=>{
    const tn=KEYS[S.key][1], out=[];
    REGS.forEach((r,ri)=>[0].concat(STEPS).forEach((st,fi)=>out.push({m:tn+r+st,reg:ri,f:fi})));
    out.push({m:tn+31,reg:4,f:4},{m:tn+32,reg:4,f:1});
    return out;
  };
  const GEN={ctx:null,osc:[],gain:null,idx:-1,key:-1};
  function renderTargets(match){
    if(match!==undefined) TN.match=match; match=TN.match;
    const T=t(), box=$("tnTargets"), sig=S.key+"|"+S.lang, all=allNotes();
    if(box.dataset.sig!==sig){   // rebuild only when key or language changes, so taps are not lost
      box.dataset.sig=sig;
      let h="", reg=-1;
      all.forEach((n,i)=>{
        if(n.reg!==reg){reg=n.reg; h+=`<span class="tn-reg" title="${T.tnReg(reg+1)}" aria-label="${T.tnReg(reg+1)}">${reg+1}</span>`;}
        const open=[[],[1],[1,2],[1,2,3],[2]][n.f];
        const dots=[3,2,1].map(k=>`<i class="${open.includes(k)?"":"cl"}"></i>`).join("");
        h+=`<button type="button" class="tn-t" data-n="${i}" aria-pressed="false" aria-label="${noteTxtA(n.m)}, ${T.tnFing[n.f]}"><span class="pl"></span><span class="fd" aria-hidden="true">${dots}</span><b>${noteHtml(n.m)}</b><span class="c"></span></button>`;
      });
      box.innerHTML=h;
    }
    box.querySelectorAll(".tn-t").forEach(btn=>{
      const i=+btn.dataset.n, on=!!(match&&match.i===i), ok=on&&Math.abs(match.c)<=5, pl=GEN.idx===i;
      btn.classList.toggle("on",on); btn.classList.toggle("ok",ok); btn.setAttribute("aria-pressed",pl);
      btn.querySelector(".c").textContent=on?(match.c>0?"+":match.c<0?"−":"")+Math.abs(Math.round(match.c))+" "+T.cents:"";
      btn.querySelector(".pl").textContent=pl?"■":"▶";
    });
  }
  // note generator: loud, soft-edged tone with harmonics so phone speakers can play low notes
  function genStop(){
    if(GEN.gain&&GEN.ctx){
      const g=GEN.gain, now=GEN.ctx.currentTime, os=GEN.osc;
      g.gain.cancelScheduledValues(now); g.gain.setTargetAtTime(0,now,0.03);
      setTimeout(()=>os.forEach(o=>{try{o.stop();}catch(e){}}),250);
    }
    GEN.osc=[];GEN.gain=null;GEN.idx=-1; renderTargets();
  }
  function genPlay(i){
    try{
      if(!GEN.ctx){
        GEN.ctx=new (window.AudioContext||window.webkitAudioContext)();
        GEN.comp=GEN.ctx.createDynamicsCompressor();
        GEN.comp.threshold.value=-10; GEN.comp.knee.value=6; GEN.comp.ratio.value=8;
        GEN.comp.attack.value=0.003; GEN.comp.release.value=0.2;
        GEN.comp.connect(GEN.ctx.destination);
      }
      if(GEN.ctx.state==="suspended") GEN.ctx.resume();
      if(GEN.idx>=0) genStop();
      const f=fOf(allNotes()[i].m), g=GEN.ctx.createGain(); g.gain.value=0; g.connect(GEN.comp);
      [[1,.6],[2,.4],[3,.25],[4,.14],[5,.07]].forEach(([h,a])=>{
        if(f*h>8000) return;
        const o=GEN.ctx.createOscillator();o.type="sine";o.frequency.value=f*h;
        const og=GEN.ctx.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start();GEN.osc.push(o);
      });
      g.gain.setTargetAtTime(1.6,GEN.ctx.currentTime,0.04);
      GEN.gain=g; GEN.idx=i; GEN.key=S.key; renderTargets();
    }catch(e){}
  }

  // McLeod-style normalized autocorrelation
  function detect(x,sr){
    const N=x.length; let e=0; for(let i=0;i<N;i++) e+=x[i]*x[i];
    if(e<1e-10) return null;   // only true digital silence is skipped
    const minLag=Math.max(2,Math.floor(sr/2400)), maxLag=Math.min(Math.floor(sr/110),(N>>1));
    const n=new Float32Array(maxLag+2);
    for(let tau=minLag;tau<=maxLag+1;tau++){
      let ac=0,m=0;
      for(let j=0;j<N-tau;j++){const a=x[j],b=x[j+tau];ac+=a*b;m+=a*a+b*b;}
      n[tau]=m>0?2*ac/m:0;
    }
    let tau=minLag; while(tau<maxLag&&n[tau]>0) tau++;
    const peaks=[]; let pos=false,best=-1,bestT=-1;
    for(;tau<=maxLag;tau++){
      if(n[tau]>0){ if(!pos){pos=true;best=-1;} if(n[tau]>best){best=n[tau];bestT=tau;} }
      else if(pos){pos=false;peaks.push([bestT,best]);}
    }
    if(pos&&bestT>0) peaks.push([bestT,best]);
    if(!peaks.length) return null;
    const mx=Math.max(...peaks.map(p=>p[1])); if(mx<0.45) return null;
    const pk=peaks.find(p=>p[1]>=0.86*mx), T0=pk[0];
    const a=n[T0-1],b=n[T0],c=n[T0+1], den=a-2*b+c, sh=den?(a-c)/(2*den):0;
    return sr/(T0+sh);
  }

  function show(mf,f){
    const T=t(), all=allNotes();
    let best=null;
    all.forEach((n,i)=>{const c=(mf-n.m)*100; if(!best||Math.abs(c)<Math.abs(best.c)) best={i,m:n.m,c};});
    const hit=best&&Math.abs(best.c)<=80, near=Math.round(mf), c=hit?best.c:(mf-near)*100;
    $("tnNote").innerHTML=noteHtml(hit?best.m:near);
    $("tnCents").textContent=(c>0?"+":c<0?"−":"")+Math.abs(Math.round(c))+" "+T.cents+" · "+f.toFixed(1)+" Hz";
    setNeedle(c); renderTargets(hit?best:null);
  }
  function setNeedle(c){
    const v=Math.max(-50,Math.min(50,c));
    const nd=$("tnNeedle"); nd.style.left=(50+v)+"%"; nd.classList.toggle("ok",Math.abs(c)<=5);
  }
  function loop(){
    if(!TN.on) return;
    TN.raf=requestAnimationFrame(loop);
    TN.an.getFloatTimeDomainData(TN.buf);
    let e=0; for(let i=0;i<TN.buf.length;i++) e+=TN.buf[i]*TN.buf[i];
    const rms=Math.sqrt(e/TN.buf.length), lvl=Math.max(0,Math.min(1,(Math.log10(rms+1e-9)+5)/4.3));
    $("tnLevel").style.width=(lvl*100)+"%";
    const f=detect(TN.buf,TN.ctx.sampleRate), now=performance.now();
    if(f){
      TN.hist.push(f); if(TN.hist.length>9) TN.hist.shift();
      const fm=[...TN.hist].sort((a,b)=>a-b)[TN.hist.length>>1], mf=69+12*Math.log2(fm/A4);
      // inertia: glide toward the new reading; jump only when a different note starts
      if(TN.sm===null||Math.abs(mf-TN.sm)>0.6) TN.sm=mf; else TN.sm+=(mf-TN.sm)*0.12;
      show(TN.sm,A4*Math.pow(2,(TN.sm-69)/12)); TN.last=now;
      $("tnMain").classList.remove("stale"); $("tnTip").textContent="";
    } else if(now-TN.last>1200){
      TN.hist=[]; TN.sm=null; $("tnMain").classList.add("stale");   // keep the last reading, just dim it
    }
  }
  async function tunerStart(){
    const T=t();
    if(typeof KD!=="undefined"&&KD.on) kdStop();
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("no media");
      TN.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
      TN.ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(TN.ctx.state==="suspended") await TN.ctx.resume();
      const src=TN.ctx.createMediaStreamSource(TN.stream);
      const hp=TN.ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=110;
      const lp=TN.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
      TN.an=TN.ctx.createAnalyser(); TN.an.fftSize=2048;
      src.connect(hp); hp.connect(lp); lp.connect(TN.an);
      TN.buf=new Float32Array(TN.an.fftSize); TN.on=true; TN.last=0; TN.hist=[]; TN.sm=null;
      $("tnTip").textContent=T.tnListen; tunerBtn(); loop();
    }catch(e){ tunerStop(); $("tnTip").textContent=T.tnMic; }
  }
  function tunerStop(){
    TN.on=false; cancelAnimationFrame(TN.raf);
    if(TN.stream) TN.stream.getTracks().forEach(tr=>tr.stop());
    if(TN.ctx) TN.ctx.close().catch(()=>{});
    TN.stream=TN.ctx=TN.an=null; tunerBtn();
  }
  function tunerBtn(){const b=$("tnBtn");b.setAttribute("aria-pressed",TN.on);b.textContent=TN.on?t().tnOff:t().tnOn;}
  $("tnBtn").addEventListener("click",()=>{TN.on?tunerStop():tunerStart();});
  function tunerOpen(open){
    S.tuner=open; $("tnBody").hidden=!open; $("tnToggle").setAttribute("aria-expanded",open);
    $("tuner").querySelector(".chev").textContent=open?"−":"+";
    if(!open){ if(TN.on) tunerStop(); if(GEN.idx>=0) genStop(); }
    try{localStorage.setItem("kamyl-lite",JSON.stringify(S));}catch(e){}
  }
  $("tnToggle").addEventListener("click",()=>tunerOpen(!S.tuner));
  tunerOpen(!!S.tuner);
  $("tnTargets").addEventListener("click",e=>{const b=e.target.closest(".tn-t");if(!b)return;const i=+b.dataset.n;GEN.idx===i?genStop():genPlay(i);});
  window.__kamylDetect=detect;
  // ---------- key finder: which kamyl can play the melody
  const OFFS=[0,1,3,5,12,13,15,17,19,20,22,24,25,27,29,31,32];   // every note of a kamyl, from the tonic
  const KD={on:false,ctx:null,stream:null,an:null,buf:null,raf:0,frames:[],prev:null,t0:0,lastA:0};
  function kdAudio(){
    return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}).then(st=>{
      const ctx=new (window.AudioContext||window.webkitAudioContext)(), src=ctx.createMediaStreamSource(st);
      const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=110;
      const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
      const an=ctx.createAnalyser(); an.fftSize=2048; src.connect(hp); hp.connect(lp); lp.connect(an);
      return {st,ctx,an};
    });
  }
  async function kdStart(){
    const T=t();
    if(TN.on) tunerStop();
    if(GEN.idx>=0) genStop();
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("no media");
      const a=await kdAudio(); KD.stream=a.st; KD.ctx=a.ctx; KD.an=a.an;
      if(KD.ctx.state==="suspended") await KD.ctx.resume();
      KD.buf=new Float32Array(KD.an.fftSize); KD.on=true; KD.prev=null; KD.t0=performance.now()-kdElapsed();
      kdBtn(); kdAnalyze(); kdLoop();
    }catch(e){ kdStop(); $("kdRes").innerHTML=`<p class="kd-msg">${T.tnMic}</p>`; }
  }
  function kdElapsed(){return KD.frames.length*1000/60;}
  function kdStop(){
    KD.on=false; cancelAnimationFrame(KD.raf);
    if(KD.stream) KD.stream.getTracks().forEach(tr=>tr.stop());
    if(KD.ctx) KD.ctx.close().catch(()=>{});
    KD.stream=KD.ctx=KD.an=null; kdBtn(); kdAnalyze();
  }
  function kdBtn(){const b=$("kdBtn");b.setAttribute("aria-pressed",KD.on);b.textContent=KD.on?t().kdOff:t().kdOn;}
  function kdLoop(){
    if(!KD.on) return;
    KD.raf=requestAnimationFrame(kdLoop);
    KD.an.getFloatTimeDomainData(KD.buf);
    const f=detect(KD.buf,KD.ctx.sampleRate), now=performance.now();
    if(f){
      const m=69+12*Math.log2(f/A4);
      if(KD.prev!==null&&Math.abs(m-KD.prev)<0.35) KD.frames.push(m);   // keep only steady, sung/played notes
      KD.prev=m; $("kdNow").innerHTML=noteHtml(Math.round(m));
    } else KD.prev=null;
    const sec=Math.round(KD.frames.length/60);
    $("kdTime").textContent=sec+" s";
    if(now-KD.lastA>500){KD.lastA=now; kdAnalyze();}
  }
  function kdAnalyze(){
    const T=t(), fr=KD.frames;
    // bars for the 12 note names
    const hist=new Array(12).fill(0);
    let off=0;
    if(fr.length){
      const dev=fr.map(m=>m-Math.round(m)).sort((a,b)=>a-b); off=dev[dev.length>>1];   // how far the recording is from A=440
      fr.forEach(m=>hist[(((Math.round(m-off))%12)+12)%12]++);
    }
    const best=kdRank(fr,off), top=best[0], mx=Math.max(1,...hist);
    const inSet=top&&fr.length>=60?new Set(OFFS.map(o=>(KEYS[top.i][1]+o)%12)):null;
    $("kdHist").innerHTML=NN.map((n,i)=>`<div class="kd-bar ${inSet&&inSet.has(i)?"in":""}"><i style="height:${Math.round(hist[i]/mx*72)+3}px"></i><span>${n}</span></div>`).join("");
    $("kdTune").textContent=fr.length>=60?T.kdTuneL((off>0?"+":off<0?"−":"")+Math.abs(Math.round(off*100))):"";
    if(fr.length<300){ $("kdRes").innerHTML=`<p class="kd-msg">${fr.length?T.kdWait:(KD.on?T.kdWait:T.kdIdle)}</p>`; return; }
    $("kdRes").innerHTML=best.slice(0,3).map((r,j)=>{
      const miss=r.miss.length?T.kdMiss(r.miss.join(", ")):T.kdAll;
      return `<button type="button" class="kd-r ${j===0?"best":""}" data-k="${r.i}"><span class="kd-l"><b>${T.kdKamyl} ${noteHtml(KEYS[r.i][1])}</b><span class="kd-m">${T.kdFit(r.p)} · ${miss}</span></span><span class="kd-p">${r.i===S.key?T.kdSel:""}</span></button>`;
    }).join("");
  }
  function kdRank(fr,off){
    if(!fr.length) return [];
    const cnt=new Map(); fr.forEach(m=>{const k=Math.round(m-off);cnt.set(k,(cnt.get(k)||0)+1);});
    const total=fr.length, out=[];
    KEYS.forEach(([n,tonic],i)=>{
      const set=new Set(OFFS.map(o=>tonic+o));
      // best octave placement: most of the melody playable, then the lowest (easiest) registers
      let best=null;
      [-24,-12,0,12,24].forEach(sh=>{
        let c=0,hi=0; cnt.forEach((v,k)=>{if(set.has(k+sh)){c+=v;hi+=v*(k+sh-tonic);}});
        const score=c/total*100-(c?hi/c:32)/32*3;
        if(!best||score>best.score) best={score,c,sh};
      });
      const miss=[]; cnt.forEach((v,k)=>{if(!set.has(k+best.sh)&&v/total>0.03){const nm=NN[(((k+best.sh)%12)+12)%12]; if(miss.indexOf(nm)<0) miss.push(nm);}});
      out.push({i,p:Math.round(best.c/total*100),score:best.score,miss});
    });
    return out.sort((a,b)=>b.score-a.score);
  }
  $("kdBtn").addEventListener("click",()=>{KD.on?kdStop():kdStart();});
  $("kdReset").addEventListener("click",()=>{KD.frames=[];KD.prev=null;$("kdNow").textContent="-";$("kdTime").textContent="";kdAnalyze();});
  $("kdRes").addEventListener("click",e=>{const b=e.target.closest(".kd-r");if(!b)return;S.key=+b.dataset.k;render();kdAnalyze();});
  function kdOpen(open){
    S.kd=open; $("kdBody").hidden=!open; $("kdToggle").setAttribute("aria-expanded",open);
    $("kd").querySelector(".chev").textContent=open?"−":"+";
    if(!open&&KD.on) kdStop();
    try{localStorage.setItem("kamyl-lite",JSON.stringify(S));}catch(e){}
  }
  $("kdToggle").addEventListener("click",()=>kdOpen(!S.kd));
  kdOpen(!!S.kd);
  window.__kamylRank=kdRank;


  function render(){
    try{localStorage.setItem("kamyl-lite",JSON.stringify(S));}catch(e){}
    const T=t();
    document.documentElement.lang=S.lang;
    document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T[el.dataset.i]);
    $("ru").setAttribute("aria-pressed",S.lang==="ru");$("en").setAttribute("aria-pressed",S.lang==="en");
    [...keysEl.children].forEach((b,i)=>b.setAttribute("aria-pressed",i===S.key));
    const r=calc(KEYS[S.key][1]);
    const v=x=>r.ok?`${Math.round(x)}<small>${T.mm}</small>`:"-";
    $("result").innerHTML=
      `<div class="row"><span class="k">${T.len}</span><span class="v">${v(r.L)}</span></div>`+
      r.holes.map((h,i)=>`<div class="row"><span class="k">${T.h[i]}</span><span class="v">${v(h)}</span></div>`).join("")+
      (r.ok?"":`<div class="row"><span class="k">${wallOf()>0?T.bad:T.badOuter}</span></div>`);
    const w=wallOf();
    $("wallOut").textContent=w>0?String(Math.round(w*100)/100).replace(".",S.lang==="ru"?",":"."):"-";
    $("drawingBox").hidden=!r.ok;
    const half=String(Math.round(S.hole/2*10)/10).replace(".",S.lang==="ru"?",":".");
    $("fb").innerHTML=T.fb+`<a href="https://www.instagram.com/circassian_flute/" target="_blank" rel="noopener">@circassian_flute</a>`;
    $("howto").innerHTML=`<h2>${T.howT}</h2><ol>`+T.how(half).map(x=>`<li>${x}</li>`).join("")+`</ol>`;
    $("drawing").innerHTML=r.ok?drawing(r,T):"";
    if(GEN.idx>=0&&GEN.key!==S.key) genStop();
    if(typeof kdBtn==="function"){kdBtn(); kdAnalyze();}
    tunerBtn(); renderTargets(TN.on?undefined:null);
    if(!TN.on){$("tnTip").textContent=T.tnIdle;$("tnNote").textContent="-";}
  }
  render();
})();
</script>
</body>
</html>
